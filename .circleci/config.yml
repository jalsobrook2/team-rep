version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:18.19
      - image: mongo:7.0
        environment:
          MONGO_INITDB_DATABASE: backend-example-test
    
    steps:
      - checkout
      
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            - v1-dependencies-
      
      - run:
          name: Install Dependencies
          command: npm install
      
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
      
      - run:
          name: Wait for MongoDB
          command: |
            # Use a bash TCP open check (no nc dependency) to wait for MongoDB to accept connections.
            for i in {1..30}; do
              # /dev/tcp is a bash built-in that attempts to open a TCP connection.
              if (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1; then
                echo "MongoDB is ready"
                exit 0
              fi
              echo "Waiting for MongoDB... ($i/30)"
              sleep 2
            done
            echo "MongoDB failed to start"
            exit 1
      
      - run:
          name: Run Tests with Coverage
          command: npm run test:coverage
          environment:
            NODE_ENV: test
            MONGODB_URI_TEST: mongodb://localhost:27017/backend-example-test
      
      - store_test_results:
          path: coverage
      
      - store_artifacts:
          path: coverage
          destination: coverage-report

workflows:
  test-workflow:
    jobs:
      - test
