version: '3.8'

# Development-specific overrides
services:
  backend:
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./Backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "9229:9229" # Debug port for Node.js

  frontend:
    command: npm start
    environment:
      CHOKIDAR_USEPOLLING: true
      FAST_REFRESH: true
    volumes:
      - ./Frontend:/app
      - /app/node_modules

  postgres:
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql